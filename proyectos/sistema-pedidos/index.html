<!DOCTYPE html>
<html lang="es">
<head>
<script src="../demo.js"></script>
    <meta charset="UTF-8">
    <title>Sistema de Pedidos</title>
    <link rel="stylesheet" href="estilos2.css">
</head>

<body>
    <h1>Pedidos de Productos</h1>
    <h2>Datos del cliente</h2>

    <label>Nombre del cliente:</label>
    <input type="text" id="cliente">
    <br><br>

    <label>Correo electrónico:</label>
    <input type="email" id="correo">
    <br><br>

    <label>Teléfono:</label>
    <input type="tel" id="telefono">
    <br><br>

    <label>Fecha del pedido:</label>
    <input type="date" id="fecha">
    <br><br>

    <h2>Productos</h2>
    <table border="1">
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Importe</th>
        </tr>

        <tr>
            <td>
                <select id="producto1" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="12000">Laptop Lenovo IdeaPad</option>
                    <option value="850">Monitor LG 24"</option>
                    <option value="150">Teclado mecánico RGB</option>
                    <option value="250">Mouse inalámbrico</option>
                    <option value="350">Audífonos Bluetooth</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio1" readonly>
            </td>

            <td>
                <input type="number" id="cantidad1" value="0" min="0" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe1" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="producto2" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="12000">Laptop Lenovo IdeaPad</option>
                    <option value="850">Monitor LG 24"</option>
                    <option value="150">Teclado mecánico RGB</option>
                    <option value="250">Mouse inalámbrico</option>
                    <option value="350">Audífonos Bluetooth</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio2" readonly>
            </td>

            <td>
                <input type="number" id="cantidad2" value="0" min="0" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe2" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="producto3" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="12000">Laptop Lenovo IdeaPad</option>
                    <option value="850">Monitor LG 24"</option>
                    <option value="150">Teclado mecánico RGB</option>
                    <option value="250">Mouse inalámbrico</option>
                    <option value="350">Audífonos Bluetooth</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio3" readonly>
            </td>

            <td>
                <input type="number" id="cantidad3" value="0" min="0" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe3" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="producto4" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="12000">Laptop Lenovo IdeaPad</option>
                    <option value="850">Monitor LG 24"</option>
                    <option value="150">Teclado mecánico RGB</option>
                    <option value="250">Mouse inalámbrico</option>
                    <option value="350">Audífonos Bluetooth</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio4" readonly>
            </td>

            <td>
                <input type="number" id="cantidad4" value="0" min="0" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe4" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="producto5" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="12000">Laptop Lenovo IdeaPad</option>
                    <option value="850">Monitor LG 24"</option>
                    <option value="150">Teclado mecánico RGB</option>
                    <option value="250">Mouse inalámbrico</option>
                    <option value="350">Audífonos Bluetooth</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio5" readonly>
            </td>

            <td>
                <input type="number" id="cantidad5" value="0" min="0" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe5" readonly>
            </td>
        </tr>
    </table>

    <h2>Datos del pedido</h2>

    <label>Tipo de entrega:</label>

    <select id="envio" onchange="calcular()">
        <option value="0">Recoger en tienda - $0</option>
        <option value="80">Envío estándar - $80</option>
        <option value="150">Envío exprés - $150</option>
    </select>

    <br><br>

    <label>Dirección de entrega:</label>
    <input type="text" id="direccion">

    <br><br>

    <label>Forma de pago:</label>
    <select id="pago">
        <option>Tarjeta</option>
        <option>Transferencia</option>
        <option>Efectivo</option>
    </select>

    <br><br>

    <label>Comentarios adicionales:</label>
    <input type="text" id="comentarios">

    <br><br>

    <h2>Resumen</h2>

    <label>Subtotal:</label>
    <input type="number" id="subtotal" readonly>
    <br><br>

    <label>Descuento:</label>
    <input type="number" id="descuento" readonly>
    <br><br>

    <label>IVA (16%):</label>
    <input type="number" id="iva" readonly>
    <br><br>

    <label>Envío:</label>
    <input type="number" id="costoEnvio" readonly>
    <br><br>

    <label><strong>Total:</strong></label>
    <input type="number" id="total" readonly>

    <br><br>

    <button onclick="generarPedido()">Generar pedido</button>

    <button onclick="limpiar()">Nuevo pedido</button>

    <h2>Resultado</h2>

    <div id="resultado"></div>

    <script>

        // Productos del formulario de Google y el código (entry) de su pregunta de cantidad
        let productosForm = [
            { nombre: "Laptop Lenovo IdeaPad", entry: "entry.111234712" },
            { nombre: 'Monitor LG 24"', entry: "entry.715125236" },
            { nombre: "Teclado mecánico RGB", entry: "entry.1997244445" },
            { nombre: "Mouse inalámbrico", entry: "entry.1782705347" },
            { nombre: "Audífonos Bluetooth", entry: "entry.997651645" }
        ];

        let meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio",
            "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        let enviado = false;


        function calcular() {

            let subtotal = 0;

            for (let i = 1; i <= 5; i++) {

                let producto = document.getElementById("producto" + i);
                let cantidad = document.getElementById("cantidad" + i);

                let precio = Number(producto.value);
                let cant = Number(cantidad.value);

                let importe = precio * cant;

                document.getElementById("precio" + i).value = precio;
                document.getElementById("importe" + i).value = importe.toFixed(2);

                subtotal += importe;
            }

            let descuento = 0;

            // Descuento dependiendo del monto
            if (subtotal >= 3000) {
                descuento = subtotal * 0.10;
            }
            else if (subtotal >= 1500) {
                descuento = subtotal * 0.05;
            }

            let subtotalDescuento = subtotal - descuento;

            let iva = subtotalDescuento * 0.16;

            let envio = Number(document.getElementById("envio").value);

            let total = subtotalDescuento + iva + envio;

            document.getElementById("subtotal").value =
                subtotal.toFixed(2);

            document.getElementById("descuento").value =
                descuento.toFixed(2);

            document.getElementById("iva").value =
                iva.toFixed(2);

            document.getElementById("costoEnvio").value =
                envio.toFixed(2);

            document.getElementById("total").value =
                total.toFixed(2);
        }


        function generarPedido() {

            if (enviado) {
                alert("Este pedido ya fue enviado. Presione 'Nuevo pedido' para capturar otro.");
                return;
            }

            let cliente = document.getElementById("cliente").value.trim();
            let correo = document.getElementById("correo").value.trim();
            let telefono = document.getElementById("telefono").value.trim();
            let fecha = document.getElementById("fecha").value;

            if (cliente === "") {
                alert("Debe ingresar el nombre del cliente.");
                return;
            }

            if (correo === "" || correo.indexOf("@") === -1) {
                alert("Debe ingresar un correo electrónico válido.");
                return;
            }

            if (telefono === "") {
                alert("Debe ingresar el teléfono.");
                return;
            }

            if (fecha === "") {
                alert("Debe seleccionar la fecha.");
                return;
            }

            calcular();

            // Cantidad por producto (si un producto se repite en varias filas, se suman)
            let cantidades = {};
            let detalle = [];

            for (let i = 1; i <= 5; i++) {

                let select = document.getElementById("producto" + i);
                let cant = Number(document.getElementById("cantidad" + i).value);

                if (select.value !== "0" && cant > 0) {
                    let nombre = select.options[select.selectedIndex].text;
                    cantidades[nombre] = (cantidades[nombre] || 0) + cant;
                    detalle.push(cant + " x " + nombre);
                }
            }

            if (detalle.length === 0) {
                alert("Debe seleccionar al menos un producto con cantidad.");
                return;
            }

            let total = document.getElementById("total").value;

            let envio = document.getElementById("envio");
            let tipoEntrega = envio.options[envio.selectedIndex].text;

            let direccion = document.getElementById("direccion").value.trim();

            if (direccion === "") {
                if (Number(envio.value) > 0) {
                    alert("Debe ingresar la dirección de entrega.");
                    return;
                }
                direccion = "Recoger en tienda";
            }

            let comentarios = document.getElementById("comentarios").value.trim();

            if (comentarios === "") {
                comentarios = "Sin comentarios";
            }

            // Fecha con el formato del formulario: 15-Octubre-2026
            let partes = fecha.split("-");
            let fechaForm = partes[2] + "-" + meses[Number(partes[1]) - 1] + "-" + partes[0];

            // Registro en Google Forms (envío directo, sin abrir otra página)
            let url = "demo://formulario";

            let datos = new URLSearchParams();

            datos.append("entry.897307571", cliente);
            datos.append("entry.903616015", correo);
            datos.append("entry.6839456", telefono);
            datos.append("entry.1292517209", fechaForm);

            for (let i = 0; i < productosForm.length; i++) {
                datos.append(productosForm[i].entry, cantidades[productosForm[i].nombre] || 0);
            }

            datos.append("entry.770529990", total);
            datos.append("entry.1156082798", detalle.join(", "));
            datos.append("entry.473530468", tipoEntrega);
            datos.append("entry.552470837", direccion);
            datos.append("entry.2078466422", document.getElementById("pago").value);
            datos.append("entry.165252746", comentarios);

            enviado = true;

            fetch(url, {
                method: "POST",
                mode: "no-cors",
                body: datos
            }).then(function () {
                document.getElementById("estadoEnvio").innerHTML =
                    "Pedido registrado (demostración: no se envió a ningún formulario).";
            }).catch(function () {
                enviado = false;
                document.getElementById("estadoEnvio").innerHTML =
                    "No se pudo enviar el pedido. Revise su conexión e intente de nuevo.";
            });

            document.getElementById("resultado").innerHTML =

                "<h3>Pedido generado correctamente</h3>" +

                "<p><strong>Cliente:</strong> " +
                cliente + "</p>" +

                "<p><strong>Fecha:</strong> " +
                fecha + "</p>" +

                "<p><strong>Total a pagar:</strong> $" +
                total + "</p>" +

                "<p id='estadoEnvio'>Enviando pedido...</p>";
        }


        function limpiar() {

            enviado = false;

            document.getElementById("cliente").value = "";
            document.getElementById("correo").value = "";
            document.getElementById("telefono").value = "";
            document.getElementById("fecha").value = "";

            for (let i = 1; i <= 5; i++) {

                document.getElementById("producto" + i).value = "0";
                document.getElementById("cantidad" + i).value = "0";
                document.getElementById("precio" + i).value = "";
                document.getElementById("importe" + i).value = "";
            }

            document.getElementById("envio").value = "0";
            document.getElementById("direccion").value = "";
            document.getElementById("pago").selectedIndex = 0;
            document.getElementById("comentarios").value = "";

            document.getElementById("subtotal").value = "";
            document.getElementById("descuento").value = "";
            document.getElementById("iva").value = "";
            document.getElementById("costoEnvio").value = "";
            document.getElementById("total").value = "";
            document.getElementById("resultado").innerHTML = "";
        }

    </script>

</body>
</html>
