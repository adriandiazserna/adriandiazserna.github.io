<!DOCTYPE html>
<html lang="es">
<head>
<script src="../demo.js"></script>
    <meta charset="UTF-8">
    <title>Agencia de Publicidad y Comunicación</title>
    <link rel="stylesheet" href="nuevo.css">
</head>

<body>
    <h1>Agencia de Publicidad y Comunicación</h1>
    <h2>Datos del cliente</h2>

    <label>Nombre del cliente o empresa:</label>
    <input type="text" id="cliente">
    <br><br>

    <label>Teléfono:</label>
    <input type="text" id="telefono">
    <br><br>

    <label>Correo electrónico:</label>
    <input type="email" id="correo">
    <br><br>

    <label>Fecha de solicitud:</label>
    <input type="date" id="fechaSolicitud">
    <br><br>

    <h2>Servicios</h2>
    <table border="1">
        <tr>
            <th>Servicio</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Importe</th>
        </tr>

        <tr>
            <td>
                <select id="servicio1" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="500">Fotografía de producto</option>
                    <option value="450">Diseño de folleto publicitario</option>
                    <option value="250">Diseño de publicación para redes sociales</option>
                    <option value="600">Diseño de infografía</option>
                    <option value="350">Diseño de banner publicitario</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio1" readonly>
            </td>

            <td>
                <input type="number" id="cantidad1" value="1" min="1" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe1" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="servicio2" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="500">Fotografía de producto</option>
                    <option value="450">Diseño de folleto publicitario</option>
                    <option value="250">Diseño de publicación para redes sociales</option>
                    <option value="600">Diseño de infografía</option>
                    <option value="350">Diseño de banner publicitario</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio2" readonly>
            </td>

            <td>
                <input type="number" id="cantidad2" value="1" min="1" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe2" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="servicio3" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="500">Fotografía de producto</option>
                    <option value="450">Diseño de folleto publicitario</option>
                    <option value="250">Diseño de publicación para redes sociales</option>
                    <option value="600">Diseño de infografía</option>
                    <option value="350">Diseño de banner publicitario</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio3" readonly>
            </td>

            <td>
                <input type="number" id="cantidad3" value="1" min="1" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe3" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="servicio4" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="500">Fotografía de producto</option>
                    <option value="450">Diseño de folleto publicitario</option>
                    <option value="250">Diseño de publicación para redes sociales</option>
                    <option value="600">Diseño de infografía</option>
                    <option value="350">Diseño de banner publicitario</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio4" readonly>
            </td>

            <td>
                <input type="number" id="cantidad4" value="1" min="1" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe4" readonly>
            </td>
        </tr>

        <tr>
            <td>
                <select id="servicio5" onchange="calcular()">
                    <option value="0">Seleccione</option>
                    <option value="500">Fotografía de producto</option>
                    <option value="450">Diseño de folleto publicitario</option>
                    <option value="250">Diseño de publicación para redes sociales</option>
                    <option value="600">Diseño de infografía</option>
                    <option value="350">Diseño de banner publicitario</option>
                </select>
            </td>

            <td>
                <input type="number" id="precio5" readonly>
            </td>

            <td>
                <input type="number" id="cantidad5" value="1" min="1" oninput="calcular()">
            </td>

            <td>
                <input type="number" id="importe5" readonly>
            </td>
        </tr>
    </table>

    <h2>Información adicional</h2>

    <label>Tipo de cliente:</label>
    <select id="tipo">
        <option>Empresa</option>
        <option>Emprendedor</option>
        <option>Particular</option>
    </select>
    <br><br>

    <label>Objetivo de la contratación:</label>
    <select id="objetivo">
        <option>Promoción de un producto</option>
        <option>Posicionamiento de marca</option>
        <option>Publicidad de un evento</option>
        <option>Difusión de un servicio</option>
        <option>Otro</option>
    </select>
    <br><br>

    <label>Medio principal de difusión:</label>
    <select id="medio">
        <option>Facebook</option>
        <option>Instagram</option>
        <option>TikTok</option>
        <option>Página web</option>
        <option>Medios impresos</option>
        <option>Otro</option>
    </select>
    <br><br>

    <label>Fecha estimada de entrega:</label>
    <input type="date" id="fechaEntrega">
    <br><br>

    <h2>Información de pago</h2>

    <label>Forma de pago:</label>
    <select id="forma">
        <option>Efectivo</option>
        <option>Transferencia</option>
        <option>Tarjeta</option>
    </select>
    <br><br>

    <label>Estado del pago:</label>
    <select id="estado">
        <option>Pendiente</option>
        <option>Anticipo realizado</option>
        <option>Liquidado</option>
    </select>
    <br><br>

    <label><strong>Total a pagar:</strong></label>
    <input type="number" id="total" readonly>

    <br><br>

    <button onclick="generarPedido()">Registrar contratación</button>

    <button onclick="limpiar()">Nueva contratación</button>

    <h2>Resultado</h2>

    <div id="resultado"></div>

    <script>

        document.getElementById("fechaSolicitud").value = new Date().toLocaleDateString("en-CA");

        function calcular() {

            let total = 0;

            for (let i = 1; i <= 5; i++) {

                let precio = Number(document.getElementById("servicio" + i).value);
                let cantidad = Number(document.getElementById("cantidad" + i).value);

                let importe = precio * cantidad;

                document.getElementById("precio" + i).value = precio;
                document.getElementById("importe" + i).value = importe.toFixed(2);

                total += importe;
            }

            document.getElementById("total").value = total.toFixed(2);
        }


        function agregarFecha(datos, entry, fecha) {

            let partes = fecha.split("-");

            datos.append("entry." + entry, fecha);
            datos.append("entry." + entry + "_year", partes[0]);
            datos.append("entry." + entry + "_month", Number(partes[1]));
            datos.append("entry." + entry + "_day", Number(partes[2]));
        }


        function generarPedido() {

            calcular();

            let cliente = document.getElementById("cliente").value;
            let telefono = document.getElementById("telefono").value;
            let correo = document.getElementById("correo").value;
            let fechaSolicitud = document.getElementById("fechaSolicitud").value;
            let fechaEntrega = document.getElementById("fechaEntrega").value;
            let total = document.getElementById("total").value;

            let url = "demo://formulario";

            let datos = new URLSearchParams();

            datos.append("entry.596034210", cliente);
            datos.append("entry.1177955944", telefono);
            datos.append("entry.517765972", correo);
            agregarFecha(datos, "1201823794", fechaSolicitud);

            let entradasServicio = ["1288464881", "31447761", "1535792537", "1432781823", "1564278598"];
            let entradasCantidad = ["1731721658", "569800495", "1850469124", "1759702472", "1784343856"];
            let entradasPrecio = ["880929601", "9403097", "1895317317", "1717839489", "1897597366"];
            let entradasImporte = ["1342924522", "142184355", "1919689756", "86036139", "676980707"];

            let lista = "";
            let cantidadServicios = 0;

            for (let i = 1; i <= 5; i++) {

                let select = document.getElementById("servicio" + i);

                if (select.value !== "0") {

                    let nombre = select.options[select.selectedIndex].text;
                    let precio = Number(select.value);
                    let cantidad = Number(document.getElementById("cantidad" + i).value);
                    let importe = precio * cantidad;

                    datos.append("entry." + entradasServicio[i - 1], nombre);
                    datos.append("entry." + entradasCantidad[i - 1], cantidad);
                    datos.append("entry." + entradasPrecio[i - 1], precio);
                    datos.append("entry." + entradasImporte[i - 1], importe);

                    lista += "<p>" + nombre + " - " + cantidad + " x $" + precio + " = $" + importe.toFixed(2) + "</p>";
                    cantidadServicios++;
                }
            }

            datos.append("entry.233784952", document.getElementById("tipo").value);
            datos.append("entry.1921126012", document.getElementById("objetivo").value);
            datos.append("entry.1871673106", document.getElementById("medio").value);
            agregarFecha(datos, "1191018319", fechaEntrega);
            datos.append("entry.1375255422", document.getElementById("forma").value);
            datos.append("entry.872020916", document.getElementById("estado").value);
            datos.append("entry.125072096", total);

            fetch(url, {
                method: "POST",
                mode: "no-cors",
                body: datos
            });

            document.getElementById("resultado").innerHTML =

                "<h3>Contratación registrada correctamente</h3>" +

                "<p><strong>Cliente:</strong> " +
                cliente + "</p>" +

                "<p><strong>Fecha de solicitud:</strong> " +
                fechaSolicitud + "</p>" +

                "<p><strong>Servicios contratados:</strong> " +
                cantidadServicios + "</p>" +

                lista +

                "<p><strong>Total a pagar:</strong> $" +
                total + "</p>";
        }


        function limpiar() {

            document.getElementById("cliente").value = "";
            document.getElementById("telefono").value = "";
            document.getElementById("correo").value = "";
            document.getElementById("fechaSolicitud").value = new Date().toLocaleDateString("en-CA");
            document.getElementById("fechaEntrega").value = "";

            for (let i = 1; i <= 5; i++) {

                document.getElementById("servicio" + i).value = "0";
                document.getElementById("cantidad" + i).value = "1";
                document.getElementById("precio" + i).value = "";
                document.getElementById("importe" + i).value = "";
            }

            document.getElementById("total").value = "";
            document.getElementById("resultado").innerHTML = "";
        }

    </script>

</body>
</html>
